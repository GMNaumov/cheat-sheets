name: ngm-llm-rag

services:
  ollama:
    image: ollama/ollama:0.40.7
    container_name: ngm-llm-rag-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ngm-llm-rag-ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: ngm-llm-rag-qdrant
    ports:
      - "127.0.0.1:6333:6333" # REST API
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - ngm-llm-rag-qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '^HTTP/.* 200 ' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  rag-app:
    build: ./rag-app
    container_name: ngm-llm-rag-app
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      CHAT_MODEL: qwen3:4b
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_BATCH_SIZE: 32
      COLLECTION_NAME: documents
      DOCS_PATH: /app/docs
    volumes:
      - ./docs:/app/docs:ro
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

volumes:
  ngm-llm-rag-ollama-data:
    name: ngm-llm-rag-ollama-data
  ngm-llm-rag-qdrant-data:
    name: ngm-llm-rag-qdrant-data
