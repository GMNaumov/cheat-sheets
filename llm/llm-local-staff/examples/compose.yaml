name: llm-local-staff

services:
  ollama-local:
    image: ollama/ollama:0.40.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-local-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m # Выгружать модель после 30 минут простоя.
      - OLLAMA_HOST=0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  open-webui-local:
    image: ghcr.io/open-webui/open-webui:v0.13.3-slim
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui-local-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama-local:11434
      - WEBUI_AUTH=false
      - WEBUI_SECRET_KEY_FILE=/app/backend/data/.webui_secret_key
    depends_on:
      ollama-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  dsh-local:
    # Digest многоплатформенного образа omdsh-dev, проверен 2026-11-15.
    image: ghcr.io/omdsh-dev/dsh-container@sha256:a447bbfcafce5d05d1e9cc861c9170bb6907ef1e31ed53a40c588bd6e77d5705
    restart: unless-stopped
    profiles: ["harness"]
    working_dir: /workspace
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - dsh-local-data:/home/node/.dsh
      - ./workspace:/workspace
    environment:
      - DSH_HOME=/home/node/.dsh
      - DSH_CONTAINER_TRUSTED_HOSTS=localhost,127.0.0.1
    depends_on:
      ollama-local:
        condition: service_healthy

volumes:
  ollama-local-data:
  open-webui-local-data:
  dsh-local-data:
